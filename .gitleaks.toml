[extend]
useDefault = true

# Exceções mínimas para valores determinísticos que exercitam validação local.
# Nenhum caminho ou regra inteira é ignorado: cada regex exige o valor público
# exato. Um segredo diferente na mesma linha continua sendo detectado.
[[allowlists]]
description = "Chaves base64url públicas usadas somente por testes do cofre"
condition = "AND"
regexTarget = "secret"
regexes = [
  '''^MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY$''',
  '''^ZmVkY2JhOTg3NjU0MzIxMGZlZGNiYTk4NzY1NDMyMTA$''',
  # Gitleaks 8.30 também testa candidatos decodificados e reduz a detecção
  # ao prefixo de oito bytes dessas mesmas fixtures públicas.
  '''^01234567$''',
  '''^fedcba98$''',
]
paths = [
  '''(^|/)config/wrangler\.test\.jsonc$''',
  '''(^|/)tests/vault\.test\.ts$''',
  '''(^|/)vitest\.config\.ts$''',
]

[[allowlists]]
description = "Prefixos decodificados das fixtures públicas do cofre"
targetRules = ["generic-api-key"]
condition = "AND"
stopwords = ["01234567", "fedcba98"]
paths = [
  '''(^|/)config/wrangler\.test\.jsonc$''',
  '''(^|/)tests/vault\.test\.ts$''',
  '''(^|/)vitest\.config\.ts$''',
]

[[allowlists]]
description = "Identificador público do modelo de agendamento dinâmico"
condition = "AND"
regexTarget = "secret"
regexes = ['''^agendamento_dinamico_v1$''']
paths = [
  '''(^|/)app/lib/flow-templates\.ts$''',
  '''(^|/)tests/domain/miniapps-functional-matrix\.test\.ts$''',
]

[[allowlists]]
description = "Chave PEM deliberadamente inválida do arquivo de exemplo"
targetRules = ["private-key"]
condition = "AND"
stopwords = ["replace-me"]
paths = ['''(^|/)\.dev\.vars\.example$''']

[[allowlists]]
description = "UUID público de versão Cloudflare no histórico de auditoria"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "secret"
regexes = ['''^56e81dda-bc6e-40c5-ad7d-9f1505b85c4a$''']
paths = ['''(^|/)docs/plano-auditoria-real-meta-2026-07-14\.md$''']

[[allowlists]]
description = "Credenciais literais e inválidas em comandos de documentação"
targetRules = ["curl-auth-header"]
condition = "AND"
stopwords = ["ACCESS_TOKEN", "dev-api-key"]
paths = [
  '''(^|/)docs/whatsapp-flows-complete-reference\.md$''',
  '''(^|/)docs/whatsapp\.context\.md$''',
  '''(^|/)docs/superpowers/plans/2026-07-05-smartzap-cf\.md$''',
]
