name: Deploy

# Deploy automático na Cloudflare via wrangler a cada push na main.
# Requer os secrets do repo: CLOUDFLARE_API_TOKEN e CLOUDFLARE_ACCOUNT_ID.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Gate: só deploya se a suíte de worker passar
      - run: npm test
      - run: npx tsc --noEmit
      - run: npm run build
      - run: npm audit --audit-level=moderate
      - run: git diff --check
      # Gate de produto: login, import com consentimento, estimativa/preflight e cancelamento.
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      # Schema antes do código; migrations precisam ser retrocompatíveis com a versão anterior.
      - run: npx wrangler d1 migrations apply smartzap --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # npm run deploy = vite build (worker + SPA) && wrangler deploy
      - run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
